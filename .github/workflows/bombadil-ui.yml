name: bombadil-ui

# End-to-end UI tests for AgentLoop Desktop: build the app from source and
# exercise it headlessly. Source lives in the private trygentic/agentloop repo
# and is checked out via a read-only trygentic-release-bot App token (same
# pattern as release-desktop.yml) — no source is committed here. Non-blocking;
# its own scheduled workflow, not a required check.
#
# Build/CI rationale (submodule + git-dep access, toolchain, display) is
# documented privately in the source repo: test/bombadil/CI.md.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Ref in trygentic/agentloop to test (main, a vX.Y.Z tag, or a commit SHA). Defaults to main.'
        required: false
        type: string
        default: 'main'
      steps:
        description: 'Number of exploration steps the runner fires.'
        required: false
        type: string
        default: '80'

# GITHUB_TOKEN is unused (every step uses a minted App token). Deny by default.
permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # Allowlist the ref before any checkout so a dispatch caller can't run
      # arbitrary-branch code with the token in scope.
      - name: Validate source_ref
        env:
          REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          REF="${REF:-main}"
          if [[ "$REF" == "main" ]] \
            || [[ "$REF" =~ ^v[0-9] ]] \
            || [[ "$REF" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "source_ref '$REF' is allowed"
          else
            echo "::error::source_ref '$REF' is not in the allowlist (main, v*, or commit SHA)"
            exit 1
          fi

      - name: Generate App token (source, read-only)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token-source
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: agentloop,agentloop-memory,scallop
          permission-contents: read

      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: trygentic/agentloop
          token: ${{ steps.app-token-source.outputs.token }}
          fetch-depth: 0
          ref: ${{ inputs.source_ref || 'main' }}

      - name: Checkout submodules
        env:
          GH_TOKEN: ${{ steps.app-token-source.outputs.token }}
        shell: bash
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app from source
        run: |
          bun run build:ts-only
          bun run build:renderer

      - name: Build daemon
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo build -p agentloop-daemon --release --manifest-path crates/Cargo.toml

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        env:
          STEPS: ${{ inputs.steps || '80' }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" node test/bombadil/electron-runner.mjs

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bombadil-violations
          path: test/bombadil/violation-step-*.png
          if-no-files-found: ignore
          retention-days: 7
