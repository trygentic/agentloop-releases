name: release-desktop

# Builds the AgentLoop desktop app from source in trygentic/agentloop and
# (optionally) publishes artifacts to this repo's GitHub Releases.
#
# Source code lives in the private trygentic/agentloop repo. This workflow
# checks it out using a token minted from the trygentic-release-bot GitHub
# App, which is installed on agentloop, agentloop-memory, and
# agentloop-releases. When this repo eventually flips public, the same
# workflow can run on free public-repo runners (incl. ARM Windows).

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Ref in trygentic/agentloop to build (branch, tag, or SHA). Defaults to main.'
        required: false
        type: string
        default: 'main'
      version:
        description: 'Release version (without v prefix). Leave empty for a dry-run packaging without publishing.'
        required: false
        type: string
      publish:
        description: 'Publish artifacts to this repo''s GitHub Releases.'
        required: false
        type: boolean
        default: false

# GITHUB_TOKEN is unused (every step uses a minted App token), so deny it
# everything we don't need. Default for private repos is already `read`,
# but spelling it out makes the intent explicit and survives a public flip
# (defaults differ for public repos in some org policies).
permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      # Publishing requires a specific version tag — without it, electron-builder
      # would attempt to upload to whatever version is currently in the
      # source's package.json (typically the last released version), either
      # overwriting that Release or appending to it. The intended publish flow
      # is: tag agentloop with vX.Y.Z, then dispatch this workflow with
      # version=X.Y.Z. source_ref is for dry-runs only.
      - name: Validate publish inputs
        if: ${{ inputs.publish }}
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "::error::publish=true requires 'version' input (e.g. 0.21.0-alpha.12)."
            echo "::error::Tag agentloop with vX.Y.Z first, then re-dispatch with version=X.Y.Z."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$VERSION' is not valid semver (without 'v' prefix)."
            exit 1
          fi
          echo "Publishing version $VERSION"

      # Validate source_ref against an allowlist before any checkout runs.
      # Untrusted refs would let a workflow_dispatch caller execute arbitrary
      # branch code with the App token in scope. Allowed: `main`, anything
      # starting with `v` followed by a digit (release tags), or a 7–40 char
      # hex commit SHA.
      - name: Validate source_ref
        env:
          REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          if [[ -z "$REF" ]]; then
            echo "source_ref is empty (will use version-derived tag)"
            exit 0
          fi
          if [[ "$REF" == "main" ]] \
            || [[ "$REF" =~ ^v[0-9] ]] \
            || [[ "$REF" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "source_ref '$REF' is allowed"
            exit 0
          fi
          echo "::error::source_ref '$REF' is not in the allowlist (main, v*, or commit SHA)"
          exit 1

      # Source-side App token. Read-only — every build step (bun install,
      # patch scripts, vendor builds) runs with this token in scope, so we
      # deny it write access to the private source repo to limit the blast
      # radius of any compromised dep.
      - name: Generate App token (source, read-only)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token-source
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: agentloop,agentloop-memory,scallop
          permission-contents: read

      # Pin to the requested ref. For tag releases pass version=X.Y.Z;
      # otherwise the workflow checks out source_ref (default main).
      - name: Checkout source (trygentic/agentloop)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: trygentic/agentloop
          token: ${{ steps.app-token-source.outputs.token }}
          fetch-depth: 0
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || inputs.source_ref }}

      - name: Checkout submodules
        env:
          GH_TOKEN: ${{ steps.app-token-source.outputs.token }}
        shell: bash
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to match `engines.bun` in the source repo's package.json.
          # `latest` previously gave us 1.3.13 here while local dev ran 1.3.10,
          # and the version delta caused Bun to re-resolve `optionalDependencies`
          # differently — re-saving the lockfile under --frozen-lockfile and
          # producing a node_modules layout electron-builder's walker rejected.
          # Keep this in sync with the source repo's engines field.
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build TypeScript
        run: bun run build:ts-only

      - name: Build renderer bundle
        run: bun run build:renderer

      # Build the agentloop-memory sidecar binary inside the vendored submodule.
      # build:desktop's `fetch-memory` step only COPIES a prebuilt binary from
      # vendor/agentloop-memory/bin/ into build-extras — it does not build it.
      # Produce it here: install submodule deps, download tree-sitter WASM
      # grammars (public GitHub releases), then compile the standalone binary.
      - name: Build agentloop-memory binary
        working-directory: vendor/agentloop-memory
        run: |
          bun install --frozen-lockfile
          bun run download:wasm
          bun run build:binary

      # Stage the bundled native daemon (cargo-built) for electron-builder
      # extraResources. Resolves a private git dependency, so fetch via the git
      # CLI to honour the token rewrite from the submodule-checkout step.
      - name: Build daemon
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: bun run fetch-rust-daemon

      # Import the Developer ID Application cert into a dedicated CI keychain.
      # electron-builder finds it via the search list (CSC_KEYCHAIN scopes the
      # lookup below). Publish path only — dry-runs ship unsigned.
      - name: Import signing certificate (macOS)
        if: ${{ inputs.publish && matrix.platform == 'darwin' }}
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW=$(openssl rand -base64 24)
          echo "$MAC_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Prepend the build keychain to the search list (keep the login one).
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

      # Publish-side App token. Minted only when actually publishing, so it
      # never exists during dry-runs and never sees user-controllable build
      # scripts. Scoped to this repo only with contents:write.
      - name: Generate App token (publish, write)
        if: ${{ inputs.publish }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token-publish
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: agentloop-releases
          permission-contents: write

      # Packaging + publishing. electron-builder reads GH_TOKEN from the env
      # and uploads to the repo configured in electron-builder.yml
      # (trygentic/agentloop-releases — i.e. this repo).
      - name: Package and publish (electron-builder)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ steps.app-token-publish.outputs.token }}
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # build:desktop re-stages the cargo-built daemon (fetch-rust-daemon);
          # fetch its private git dep via the git CLI (honours the token rewrite).
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          # Code signing: scope the cert lookup to the build keychain imported
          # above so a stray cert on the runner can't win the identity match.
          CSC_KEYCHAIN: ${{ runner.temp }}/build.keychain
          # Notarization via notarytool with the App Store Connect API key.
          # APPLE_API_KEY points at the .p8 written to disk in the run block.
          APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # ulimit must be set in the same shell as the run, since each
        # `run:` block spawns a fresh shell.
        run: |
          ulimit -n 65535
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 -d > "$RUNNER_TEMP/apple_api_key.p8"
          bun run dist:publish

      # Dry-run path: produce a real installable artifact (DMG) to validate
      # the full packaging pipeline without uploading to Releases.
      #
      # Note: `bun run dist` (= electron-builder w/o --publish) still tries
      # to interact with the configured publisher in electron-builder.yml
      # to write the auto-update manifest, which requires GH_TOKEN. We
      # explicitly pass `--publish never` to skip the publisher entirely
      # while still producing the DMG.
      - name: Package only (no publish)
        if: ${{ !inputs.publish }}
        env:
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          ulimit -n 65535
          bun run build:desktop
          node scripts/run-electron-builder.mjs --publish never

      - name: Upload packaged artifacts (dry-run only)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentloop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
            release/**/*.yml
          if-no-files-found: warn
          retention-days: 7
