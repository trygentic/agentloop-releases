name: Sign private Unrest launcher
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful private Unrest main build run ID
        required: true
        type: string
      tag:
        description: New private release tag (launcher-vX.Y.Z-pilot.N)
        required: true
        type: string
permissions: {}
concurrency:
  group: unrest-launcher-signing
  cancel-in-progress: false
jobs:
  sign:
    if: github.repository == 'trygentic/agentloop-releases' && github.ref == 'refs/heads/main'
    # Signing inspects arm64 Mach-O files without executing them.
    runs-on: macos-15-intel
    timeout-minutes: 65
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SOURCE: trygentic/unrest
      BUILD_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Scope a read token to Unrest
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: read
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: unrest
          permission-actions: read
          permission-contents: read
      - name: Verify private build and download the unsigned app
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        run: bash scripts/unrest/fetch.sh
      - name: Sign the launcher and staple its Apple notarization ticket
        env:
          P12_B64: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_B64: ${{ secrets.APPLE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/unrest/sign.sh
      - name: Scope a publication token to Unrest
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: publish
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: trygentic
          repositories: unrest
          permission-contents: write
      - name: Publish private pilot
        env:
          GH_TOKEN: ${{ steps.publish.outputs.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/launcher"
          test "$(gh api "repos/$SOURCE" --jq .private)" = true
          gh release create "$RELEASE_TAG" Unrest-Founder-Chat-arm64.zip SHA256SUMS \
            --repo "$SOURCE" --target "$(cat source-sha)" --prerelease --latest=false \
            --title "Unrest Founder Chat ${RELEASE_TAG#launcher-v} (Apple Silicon)" \
            --notes 'Notarized pilot for Apple Silicon Macs running macOS 15 or later. Download the ZIP and SHA256SUMS and run `shasum -a 256 -c SHA256SUMS` before extracting.'
